<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статьи и публикации | Наталья Баландина</title>
    <meta name="description" content="Статьи о психологии, отношениях, тревоге и поиске себя. Экспертный блог психолога-консультанта Натальи Баландиной.">
    <meta name="robots" content="index, follow">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23FAF8F5%22/><text x=%2250%22 y=%2270%22 font-size=%2265%22 font-family=%22Georgia, serif%22 text-anchor=%22middle%22 fill=%22%237A8B6F%22>Н</text></svg>">
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <style>
        /* Я оставляю здесь критические стили для сетки блога. Остальные стили сайта (header, footer, typography) нужно скопировать из index.html */
        
        .blog-header {
            padding: 10rem 3rem 4rem;
            text-align: center;
            background: var(--color-bg-alt);
        }
        .blog-header__title {
            font-family: var(--font-heading);
            font-size: clamp(2.5rem, 4vw, 3.5rem);
            color: var(--color-text);
            margin-bottom: 1rem;
        }
        .blog-header__title em {
            color: var(--color-accent);
            font-style: italic;
        }
        
        .blog-grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 5rem 3rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 3rem 2rem;
        }
        
        .article-card {
            display: flex;
            flex-direction: column;
            background: var(--color-white);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--color-bg-dark);
            transition: var(--transition);
            text-decoration: none;
            color: inherit;
        }
        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(58, 53, 48, 0.08);
            border-color: var(--color-accent-light);
        }
        .article-card__image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: var(--color-bg-alt);
        }
        .article-card__content {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .article-card__date {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }
        .article-card__title {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            font-weight: 500;
            line-height: 1.3;
            margin-bottom: 1rem;
            color: var(--color-text);
        }
        .article-card__excerpt {
            font-size: 0.9rem;
            color: var(--color-text-light);
            line-height: 1.6;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }
        .article-card__readmore {
            font-size: 0.85rem;
            color: var(--color-accent);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .article-card:hover .article-card__readmore {
            color: var(--color-accent-dark);
        }
    </style>
</head>
<body>

    <main>
        <section class="blog-header">
            <h1 class="blog-header__title">Мысли и <em>публикации</em></h1>
            <p style="color: var(--color-text-light);">Статьи о психологии, внутреннем поиске и отношениях</p>
        </section>

        <section class="blog-grid" id="blog-grid">
            
            <a href="#" class="article-card">
                <div class="article-card__image"></div> <div class="article-card__content">
                    <div class="article-card__date">18 Мая 2026</div>
                    <h2 class="article-card__title">Как пережить кризис эмиграции и не потерять себя</h2>
                    <p class="article-card__excerpt">Эмиграция — это не только логистическая задача, но и глубокий личностный кризис. Разбираем основные этапы адаптации...</p>
                    <div class="article-card__readmore">Читать статью →</div>
                </div>
            </a>
            
        </section>
    </main>

    </body>
</html>
