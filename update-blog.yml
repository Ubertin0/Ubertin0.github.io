name: Update Blog from Telegram

on:
  schedule:
    - cron: '0 */6 * * *'  # Каждые 6 часов
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Pull latest & run generator
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "action@github.com"

          # Безопасный pull: stash только если есть изменения, pop только если stash создался
          git stash push -m "auto-stash" || true
          git pull origin main --rebase || true
          git stash pop || true

          python build_blog.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update blog $(date +'%Y-%m-%d %H:%M')"
            git push origin main
          fi
