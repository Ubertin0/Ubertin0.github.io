name: Auto Update Blog from Telegram

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# ВАЖНО: Даем нашему боту права на запись в репозиторий
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Обновляем версию до v4 (уберет желтое предупреждение)
      - name: Checkout repository
        uses: actions/checkout@v4

      # Обновляем версию до v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser
        run: python build_blog.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          # Проверяем, есть ли новые файлы. Если есть — сохраняем, если нет — просто завершаем работу без ошибки
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update blog with latest Telegram posts"
          git push
